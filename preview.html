<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>README preview — IainHenn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background: #f6f8fa; margin: 0; }
    .wrap { max-width: 1012px; margin: 24px auto; padding: 0 16px 48px; }
    .banner { font-size: 13px; color: #57606a; margin-bottom: 12px; text-align: center; }
    .markdown-body { box-sizing: border-box; padding: 32px 48px; background: #fff; border: 1px solid #d0d7de; border-radius: 12px; }
    .err { color: #cf222e; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="banner">Local preview — serve this folder with a static server (not file://)</p>
    <article id="out" class="markdown-body">Loading README…</article>
  </div>
  <script>
    fetch("README.md")
      .then((r) => {
        if (!r.ok) throw new Error(r.statusText);
        return r.text();
      })
      .then((md) => {
        document.getElementById("out").innerHTML = marked.parse(md, { gfm: true });
      })
      .catch((e) => {
        document.getElementById("out").innerHTML =
          '<p class="err">Could not load README.md — start a local server in the repo root.</p>';
        console.error(e);
      });
  </script>
</body>
</html>
